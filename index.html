<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official social media and contact links for Sami.">
    <title>Sami Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. Design tokens
           ========================================================== */
        :root {
            --color-bg: #010206;
            --color-card: #05060b;
            --color-text: #ffffff;
            --color-muted: #94a3b8;
            --color-border: rgba(255, 255, 255, 0.15);

            --color-sky: #38bdf8;
            --color-violet: #a855f7;
            --color-pink: #ec4899;
            --color-green: #22c55e;
            --color-gold: #eab308;

            --radius-card: 30px;
            --radius-button: 18px;
            --radius-icon: 12px;

            --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================
           2. Base
           ========================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient neon glow behind the card */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(56, 189, 248, 0.15),
                rgba(168, 85, 247, 0.15),
                rgba(236, 72, 153, 0.15)
            );
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        /* ==========================================================
           3. Card
           ========================================================== */
        .card {
            position: relative;
            overflow: hidden;
            padding: 38px 26px;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
        }

        /* Animated neon strip along the bottom edge */
        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--color-sky), var(--color-violet), var(--color-pink), var(--color-green), var(--color-gold));
            box-shadow:
                0 0 25px var(--color-sky),
                0 0 45px var(--color-violet),
                0 0 65px var(--color-pink);
            animation: card-flow 3s ease infinite alternate;
        }

        @keyframes card-flow {
            from { filter: brightness(1); opacity: 0.8; }
            to   { filter: brightness(1.5); opacity: 1; }
        }

        /* ==========================================================
           4. Header
           ========================================================== */
        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--color-muted);
        }

        /* ==========================================================
           5. Icons (shared <symbol> definitions, see the sprite below)
           ========================================================== */
        .icon {
            display: inline-block;
            flex-shrink: 0;
            width: 1em;
            height: 1em;
            fill: currentColor;
            vertical-align: middle;
        }

        .icon--verified-header { width: 20px; height: 20px; fill: var(--color-sky); filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8)); }
        .icon--crown           { width: 15px; height: 15px; fill: var(--color-gold); filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.7)); }
        .icon--verified-sub    { width: 13px; height: 13px; fill: var(--color-sky); }

        /* ==========================================================
           6. Link list
           ========================================================== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Each button sets its own accent tokens. Defaults below. */
        .link {
            --accent-rgb: 56, 189, 248;          /* base RGB triplet */
            --accent: #38bdf8;                    /* icon colour */
            --tick: #38bdf8;                      /* verification tick colour */
            --alpha-surface: 0.1;
            --alpha-border: 0.45;
            --alpha-glow: 0.2;
            --alpha-icon: 0.2;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: var(--radius-button);
            color: var(--color-text);
            text-decoration: none;
            background: rgba(var(--accent-rgb), var(--alpha-surface));
            border: 1px solid rgba(var(--accent-rgb), var(--alpha-border));
            box-shadow: 0 0 18px rgba(var(--accent-rgb), var(--alpha-glow));
            transition: transform 0.3s var(--ease-standard), filter 0.3s var(--ease-standard);
        }

        .link:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .link__main {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: var(--radius-icon);
            color: var(--accent);
            background: rgba(var(--accent-rgb), var(--alpha-icon));
        }

        .link__icon .icon {
            width: 18px;
            height: 18px;
        }

        .link__label {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
        }

        .tick {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 6px;
            flex-shrink: 0;
            color: var(--tick);
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.8));
        }

        .tick .icon {
            width: 100%;
            height: 100%;
        }

        /* ---- Platform themes ---- */

        .link--telegram-channel {
            --accent-rgb: 56, 189, 248;
            --accent: #38bdf8;
            --tick: #38bdf8;
        }

        .link--telegram-user {
            --accent-rgb: 14, 165, 233;
            --accent: #0ea5e9;
            --tick: #38bdf8;
        }

        .link--whatsapp {
            --accent-rgb: 34, 197, 94;
            --accent: #22c55e;
            --tick: #22c55e;
        }

        .link--youtube {
            --accent-rgb: 239, 68, 68;
            --accent: #ef4444;
            --tick: #ef4444;
        }

        .link--facebook {
            --accent-rgb: 59, 130, 246;
            --accent: #3b82f6;
            --tick: #3b82f6;
        }

        .link--instagram {
            --accent-rgb: 236, 72, 153;
            --accent: #ec4899;
            --tick: #ec4899;
        }

        .link--tiktok {
            --accent-rgb: 255, 255, 255;
            --accent: #ffffff;
            --tick: #00f2fe;
            --alpha-surface: 0.08;
            --alpha-border: 0.35;
            --alpha-glow: 0.15;
            --alpha-icon: 0.15;
        }

        .link--email {
            --accent-rgb: 249, 115, 22;
            --accent: #f97316;
            --tick: #f97316;
        }

        /* Featured "About" link: animated rainbow border and glow */
        .link--featured {
            background: linear-gradient(
                135deg,
                rgba(56, 189, 248, 0.18),
                rgba(168, 85, 247, 0.18),
                rgba(236, 72, 153, 0.18)
            );
            border: 1px solid rgba(168, 85, 247, 0.7);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
            animation: rainbow-border 4s linear infinite;
        }

        .link--featured .link__icon {
            color: #ffffff;
            background: linear-gradient(135deg, var(--color-sky), var(--color-violet), var(--color-pink));
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
        }

        .link--featured .tick {
            color: #ffffff;
            filter: none;
        }

        .link--featured .tick .icon {
            fill: url(#rainbow-gradient);
            filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.9));
        }

        @keyframes rainbow-border {
            0%   { border-color: #00ff37; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
            33%  { border-color: #ff003f; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
            66%  { border-color: #8329ff; box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }
            79%  { border-color: #fff500; box-shadow: 0 0 20px rgba(236, 40, 100, 0.4); }
            100% { border-color: #29ceff; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        }

        /* ==========================================================
           7. Accessibility: respect reduced-motion preferences
           ========================================================== */
        @media (prefers-reduced-motion: reduce) {
            .card::after,
            .link--featured {
                animation: none;
            }

            .link {
                transition: none;
            }
        }

        /* ==========================================================
           8. Small screens
           ========================================================== */
        @media (max-width: 380px) {
            .card {
                padding: 30px 18px;
            }
        }
    </style>
</head>
